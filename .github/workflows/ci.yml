name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-contract-tests:
    name: Release and WinGet contract tests
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Run release contract fixtures
        shell: pwsh
        run: |
          & ".github\scripts\Test-WinGetManifestTopology.ps1"
          & ".github\scripts\Test-WinGetReleaseNotes.ps1"

  unit-tests:
    name: Unit tests (${{ matrix.framework }}, ${{ matrix.platform }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net48
          - net10.0-windows10.0.26100.0
        platform:
          - x86
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
          architecture: ${{ matrix.platform }}

      - name: Restore the complete project graph
        shell: pwsh
        run: |
          $solutionDirectory = Join-Path $env:GITHUB_WORKSPACE "source\"
          $runtimeIdentifiers = '-p:RuntimeIdentifiers="win-x86;win-x64;win-arm64"'
          dotnet restore "source\SylphyHorn.Tests\SylphyHorn.Tests.csproj" `
            -p:Configuration=Release `
            -p:Platform=${{ matrix.platform }} `
            $runtimeIdentifiers `
            -p:RuntimeIdentifier=win-${{ matrix.platform }} `
            -p:RunSylphyHornPostBuild=false `
            -p:SolutionDir="$solutionDirectory" `
            --locked-mode

      - name: Run unit tests
        shell: pwsh
        run: |
          $solutionDirectory = Join-Path $env:GITHUB_WORKSPACE "source\"
          dotnet test --project "source\SylphyHorn.Tests\SylphyHorn.Tests.csproj" `
            -c Release `
            -f ${{ matrix.framework }} `
            -p:Platform=${{ matrix.platform }} `
            -p:RunSylphyHornPostBuild=false `
            -p:SolutionDir="$solutionDirectory" `
            --no-restore

  windows-integration-tests:
    name: Non-interactive Windows integration tests
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Run environment-independent integration tests
        shell: pwsh
        run: |
          & ".github\scripts\RunHostedIntegrationTests.ps1" `
            -ResultsDirectory (Join-Path $env:RUNNER_TEMP "HostedCI-results")
